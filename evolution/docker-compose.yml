services:
  evo-postgres:
    image: postgres:15-alpine
    container_name: evo-postgres
    restart: always
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${DB_PASSWORD:-evolution123}
    volumes:
      - evo_pgdata:/var/lib/postgresql/data
    networks:
      - evo-net

  evo-redis:
    image: redis:7-alpine
    container_name: evo-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - evo_redisdata:/data
    networks:
      - evo-net

  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: evolution
    restart: always
    depends_on:
      - evo-postgres
      - evo-redis
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVO_APIKEY:-prospector123}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${DB_PASSWORD:-evolution123}@evo-postgres:5432/evolution?schema=public
      REDIS_ENABLED: "true"
      REDIS_URI: redis://evo-redis:6379
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evo-redis:6379
    volumes:
      - evo_instances:/evolution/instances
    networks:
      - evo-net

volumes:
  evo_pgdata:
  evo_redisdata:
  evo_instances:

networks:
  evo-net:
    driver: bridge
